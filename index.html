<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسار البيانات - التحدي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-yellow: #ffd700;
            --btn-orange: linear-gradient(90deg, #ffaa00, #ff7700);
            --team-a: #10b981;
            --team-b: #3b82f6;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: white;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- واجهة اللوبي (مضغوطة) --- */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 12px; }
        select, input {
            width: 100%; padding: 10px; border-radius: 10px;
            border: 1px solid #334155; background: #0f172a; color: white;
        }

        .teams-container { display: flex; gap: 15px; margin-top: 15px; }
        .team-box { flex: 1; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; border-top: 4px solid; }
        .student-item { display: flex; justify-content: space-between; padding: 5px; font-size: 0.85rem; }
        .swap-btn { background: #475569; border: none; color: white; cursor: pointer; border-radius: 4px; padding: 2px 8px; }

        .start-btn {
            background: var(--btn-orange); color: #000; font-weight: 900;
            padding: 12px 40px; border-radius: 50px; cursor: pointer; border: none; margin: 20px;
        }

        /* --- واجهة المسابقة (Game Screen) --- */
        #game-screen {
            display: none; width: 100%; max-width: 900px; padding: 20px; text-align: center;
        }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .timer-circle {
            width: 80px; height: 80px; border-radius: 50%; border: 5px solid var(--accent-yellow);
            display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900;
        }
        .timer-danger { border-color: #ef4444; color: #ef4444; animation: pulse 0.5s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .question-card {
            background: var(--panel-bg); padding: 30px; border-radius: 20px; margin-bottom: 20px;
            min-height: 200px; border: 1px solid var(--accent-yellow);
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            background: #1e293b; border: 2px solid #334155; color: white; padding: 15px;
            border-radius: 12px; cursor: pointer; font-size: 1.1rem; transition: 0.2s;
        }
        .option-btn:hover { border-color: var(--accent-yellow); background: #334155; }

        /* مسار البيانات */
        .data-path-container {
            display: flex; align-items: center; gap: 10px; margin: 20px 0; background: #000; padding: 10px; border-radius: 50px;
        }
        .path-line { flex: 1; height: 10px; background: #334155; border-radius: 5px; position: relative; overflow: hidden; }
        .packet {
            width: 20px; height: 20px; background: var(--accent-yellow); border-radius: 4px;
            position: absolute; top: -5px; transition: 1s ease-in-out;
        }
        
        .active-team { transform: scale(1.05); box-shadow: 0 0 20px var(--accent-yellow); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1 id="main-title">مسار البيانات 🚀</h1>

    <div class="glass-panel" id="lobby-panel">
        <div class="form-group">
            <select id="unit-select" onchange="loadLessons()"><option value="">-- اختر الوحدة --</option></select>
        </div>
        <div class="form-group">
            <select id="lesson-select" disabled><option value="">-- اختر الدرس --</option></select>
        </div>
        <div class="form-group">
            <select id="class-select" onchange="fetchStudentsAndGenerateTeams()">
                <option value="">-- اختر الفصل --</option>
                <option value="1">سادس (1)</option><option value="2">سادس (2)</option>
                <option value="3">سادس (3)</option><option value="4">سادس (4)</option>
                <option value="5">سادس (5)</option><option value="6">سادس (6)</option>
                <option value="7">سادس (7)</option><option value="8">سادس (8)</option>
            </select>
        </div>
        <div class="teams-container hidden" id="teams-area">
            <div class="team-box" style="border-color: var(--team-a)">
                <div id="team-a-list"></div>
            </div>
            <div class="team-box" style="border-color: var(--team-b)">
                <div id="team-b-list"></div>
            </div>
        </div>
        <button id="start-btn" class="start-btn" onclick="initGame()" disabled>ابدأ المسابقة</button>
    </div>

    <div id="game-screen">
        <div class="game-header">
            <div id="team-a-status" style="color: var(--team-a)">الفريق الأول: <span id="score-a">0</span></div>
            <div id="timer-display" class="timer-circle">30</div>
            <div id="team-b-status" style="color: var(--team-b)">الفريق الثاني: <span id="score-b">0</span></div>
        </div>

        <div class="question-card">
            <h2 id="current-team-name">دور الفريق الأول</h2>
            <p id="question-text" style="font-size: 1.4rem;"></p>
            <div id="question-image"></div>
        </div>

        <div class="options-grid" id="options-container"></div>

        <div class="data-path-container">
            <span>💻 الطلاب</span>
            <div class="path-line"><div id="packet-a" class="packet" style="left: 0; background: var(--team-a)"></div></div>
            <div class="path-line"><div id="packet-b" class="packet" style="left: 0; background: var(--team-b)"></div></div>
            <span>☁️ السيرفر</span>
        </div>
    </div>

    <audio id="sound-tick" src="https://www.soundjay.com/buttons/beep-07a.mp3"></audio>
    <audio id="sound-correct" src="https://www.soundjay.com/buttons/button-09a.mp3"></audio>
    <audio id="sound-wrong" src="https://www.soundjay.com/buttons/button-10a.mp3"></audio>

    <script>
        const QUESTIONS_ID = '1WyxijjF5hdX6B8bmCQOk-16Jwon1ejECbBuQXH0iwaI';
        const STUDENTS_ID = '1cBr5-rX-HAI-ZykHwE1cSSTyquNno82h0fyf4vUAdyI';

        let allQuestions = [], filteredQuestions = [], currentQIndex = 0;
        let students = [], teamA = [], teamB = [], scoreA = 0, scoreB = 0;
        let turn = 'A', timer, timeLeft = 30;

        // --- منطق الربط مع قوقل شيت ---
        window.onload = () => {
            fetchCSV(`https://docs.google.com/spreadsheets/d/${QUESTIONS_ID}/gviz/tq?tqx=out:csv`, (data) => {
                allQuestions = data.filter(r => r[0] && r[0] !== "الوحدة");
                const units = [...new Set(allQuestions.map(r => r[0]))];
                units.forEach(u => document.getElementById('unit-select').innerHTML += `<option value="${u}">${u}</option>`);
            });
        };

        function fetchCSV(url, callback) {
            Papa.parse(url, { download: true, complete: (results) => callback(results.data) });
        }

        function loadLessons() {
            const unit = document.getElementById('unit-select').value;
            const lessonSelect = document.getElementById('lesson-select');
            const lessons = [...new Set(allQuestions.filter(r => r[0] === unit).map(r => r[1]))];
            lessonSelect.innerHTML = '<option value="all">جميع دروس الوحدة</option>';
            lessons.forEach(l => lessonSelect.innerHTML += `<option value="${l}">${l}</option>`);
            lessonSelect.disabled = false;
        }

        function fetchStudentsAndGenerateTeams() {
            const classVal = document.getElementById('class-select').value;
            const url = `https://docs.google.com/spreadsheets/d/${STUDENTS_ID}/gviz/tq?tqx=out:csv&sheet=${classVal}`;
            fetchCSV(url, (data) => {
                students = data.map(r => r[0]).filter(n => n && n !== "الاسم");
                generateTeams();
            });
        }

        function generateTeams() {
            let shuffled = [...students].sort(() => 0.5 - Math.random());
            teamA = [shuffled[0], shuffled[1]];
            teamB = [shuffled[2], shuffled[3]];
            renderTeams();
            document.getElementById('teams-area').classList.remove('hidden');
            document.getElementById('start-btn').disabled = false;
        }

        function renderTeams() {
            const listA = document.getElementById('team-a-list');
            const listB = document.getElementById('team-b-list');
            listA.innerHTML = teamA.map((s, i) => `<div class="student-item">${s} <button class="swap-btn" onclick="swap('A',${i})">🔄</button></div>`).join('');
            listB.innerHTML = teamB.map((s, i) => `<div class="student-item">${s} <button class="swap-btn" onclick="swap('B',${i})">🔄</button></div>`).join('');
        }

        function swap(t, i) {
            let available = students.filter(s => !teamA.includes(s) && !teamB.includes(s));
            if (available.length > 0) {
                let newS = available[Math.floor(Math.random() * available.length)];
                if (t === 'A') teamA[i] = newS; else teamB[i] = newS;
                renderTeams();
            }
        }

        // --- محرك المسابقة ---
        function initGame() {
            const unit = document.getElementById('unit-select').value;
            const lesson = document.getElementById('lesson-select').value;
            filteredQuestions = allQuestions.filter(r => r[0] === unit && (lesson === 'all' || r[1] === lesson));
            filteredQuestions.sort(() => 0.5 - Math.random());
            
            document.getElementById('lobby-panel').classList.add('hidden');
            document.getElementById('main-title').classList.add('hidden');
            document.getElementById('game-screen').style.display = 'block';
            
            showQuestion();
        }

        function showQuestion() {
            if (currentQIndex >= filteredQuestions.length) { alert("انتهت الأسئلة!"); return; }
            
            clearInterval(timer);
            timeLeft = 30;
            updateTimerDisplay();
            startTimer();

            const q = filteredQuestions[currentQIndex];
            document.getElementById('current-team-name').innerText = `دور: ${turn === 'A' ? 'الفريق الأول' : 'الفريق الثاني'}`;
            document.getElementById('current-team-name').style.color = turn === 'A' ? 'var(--team-a)' : 'var(--team-b)';
            
            // معالجة السؤال (نص أو صورة)
            const qContent = q[2];
            if (qContent.includes('drive.google.com')) {
                const id = qContent.match(/\/d\/([a-zA-Z0-9_-]+)/)[1];
                document.getElementById('question-text').innerText = "حل اللبنة البرمجية التالية:";
                document.getElementById('question-image').innerHTML = `<img src="https://drive.google.com/uc?export=view&id=${id}" style="max-width:250px; border-radius:10px;">`;
            } else {
                document.getElementById('question-text').innerText = qContent;
                document.getElementById('question-image').innerHTML = "";
            }

            // عرض الخيارات
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            [3, 4, 5].forEach(idx => {
                if (q[idx]) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = q[idx];
                    btn.onclick = () => checkAnswer(idx - 2, q[6]);
                    container.appendChild(btn);
                }
            });
        }

        function checkAnswer(selected, correct) {
            clearInterval(timer);
            if (selected == correct) {
                document.getElementById('sound-correct').play();
                if (turn === 'A') { scoreA++; movePacket('A'); } else { scoreB++; movePacket('B'); }
            } else {
                document.getElementById('sound-wrong').play();
            }
            
            document.getElementById('score-a').innerText = scoreA;
            document.getElementById('score-b').innerText = scoreB;
            
            turn = (turn === 'A') ? 'B' : 'A';
            currentQIndex++;
            setTimeout(showQuestion, 1500);
        }

        function movePacket(t) {
            const packet = document.getElementById(`packet-${t.toLowerCase()}`);
            const score = t === 'A' ? scoreA : scoreB;
            packet.style.left = `${(score / 5) * 100}%`;
            if (score >= 5) { alert(`🎉 مبروك! فاز ${t === 'A' ? 'الفريق الأول' : 'الفريق الثاني'}`); location.reload(); }
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 5 && timeLeft > 0) document.getElementById('sound-tick').play();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById('sound-wrong').play();
                    turn = (turn === 'A') ? 'B' : 'A';
                    currentQIndex++;
                    showQuestion();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            display.innerText = timeLeft;
            if (timeLeft <= 5) display.classList.add('timer-danger');
            else display.classList.remove('timer-danger');
        }
    </script>
</body>
</html>
