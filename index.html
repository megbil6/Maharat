<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسار البيانات | التحدي الكبير</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12182b;
            --green-pastel: #e8f5e9;
            --red-pastel: #ffebee;
            --team-green: #2e7d32;
            --team-red: #c62828;
            --accent-yellow: #ffd700;
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: #333;
            overflow: hidden;
        }

        /* --- واجهة اللوبي (Lobby) --- */
        #lobby-panel {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
        }
        .form-group { margin-bottom: 15px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #1e293b; color: white; font-family: 'Cairo'; }
        .teams-preview { display: flex; gap: 15px; margin-top: 20px; }
        .team-preview-box { flex: 1; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border-top: 4px solid; }
        .start-btn { 
            background: linear-gradient(90deg, #ffaa00, #ff7700); 
            color: #000; font-weight: 900; border: none; padding: 15px 50px; 
            border-radius: 50px; cursor: pointer; margin-top: 20px; font-size: 1.2rem;
        }

        /* --- واجهة المسابقة (Split Screen) --- */
        #game-screen {
            display: none;
            height: 100vh;
            grid-template-rows: 80px 1fr;
        }

        /* الشريط العلوي */
        .header-bar {
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .score-box { font-size: 1.5rem; font-weight: 900; }
        .score-green { color: #4caf50; }
        .score-red { color: #f44336; }

        /* منطقة التحدي المنقسمة */
        .arena {
            display: flex;
            height: 100%;
        }
        .side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            transition: 0.5s;
            position: relative;
        }
        .side-green { background-color: var(--green-pastel); }
        .side-red { background-color: var(--red-pastel); }

        /* حالة الانتظار */
        .side.inactive { opacity: 0.4; filter: grayscale(0.5); }
        .status-badge {
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        .waiting { background: #cfd8dc; color: #546e7a; }
        .active-turn { background: #d32f2f; color: white; animation: pulse 1s infinite; }

        /* منطقة السؤال (بالمنتصف) */
        .question-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border: 2px solid #ddd;
        }
        .timer-circle {
            width: 60px; height: 60px; border-radius: 50%;
            background: #1a1a1a; color: var(--accent-yellow);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 900; margin: -60px auto 20px;
            border: 4px solid var(--accent-yellow);
        }

        /* الأزرار */
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .opt-btn {
            background: white; border: 2px solid #eee; padding: 15px;
            border-radius: 12px; cursor: pointer; font-family: 'Cairo';
            font-weight: 700; transition: 0.2s; font-size: 1.1rem;
        }
        .opt-btn:hover { border-color: #999; background: #f9f9f9; }

        .student-list { list-style: none; padding: 0; text-align: center; }
        .student-list li { font-size: 1.3rem; margin-bottom: 10px; font-weight: 700; color: #444; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lobby-panel">
        <h1 style="font-size: 2.5rem; margin-bottom: 20px;">مسار البيانات 🚀</h1>
        <div class="glass-card">
            <div class="form-group">
                <select id="unit-select" onchange="loadLessons()"><option value="">-- اختر الوحدة --</option></select>
            </div>
            <div class="form-group">
                <select id="lesson-select" disabled><option value="">-- اختر الدرس --</option></select>
            </div>
            <div class="form-group">
                <select id="class-select" onchange="fetchData()"></select>
            </div>
            <div class="teams-preview hidden" id="teams-preview">
                <div class="team-preview-box" style="border-color: #4caf50;"><div id="list-a-preview"></div></div>
                <div class="team-preview-box" style="border-color: #f44336;"><div id="list-b-preview"></div></div>
            </div>
            <button id="start-btn" class="start-btn" onclick="startGame()" disabled>ابدأ المسابقة</button>
        </div>
    </div>

    <div id="game-screen">
        <header class="header-bar">
            <div class="score-box score-green">الفريق الأخضر: <span id="score-a">0</span></div>
            <div id="lesson-title" style="font-weight: 700; color: #aaa;">مسار البيانات | الدرس الأول</div>
            <div class="score-box score-red">الفريق الأحمر: <span id="score-b">0</span></div>
        </header>

        <main class="arena">
            <section id="side-a" class="side side-green">
                <div id="status-a" class="status-badge waiting">في انتظار دورك...</div>
                <h2 style="color: var(--team-green)">الفريق الأول</h2>
                <ul id="students-a" class="student-list"></ul>
            </section>

            <section id="side-b" class="side side-red">
                <div id="status-b" class="status-badge waiting">في انتظار دورك...</div>
                <h2 style="color: var(--team-red)">الفريق الثاني</h2>
                <ul id="students-b" class="student-list"></ul>
            </section>

            <div class="question-overlay">
                <div id="timer" class="timer-circle">30</div>
                <div id="q-image"></div>
                <h2 id="q-text" style="margin: 10px 0;">جاري تحميل السؤال...</h2>
                <div class="options-container" id="options"></div>
            </div>
        </main>
    </div>

    <audio id="tick-sound" src="https://www.soundjay.com/buttons/beep-07a.mp3"></audio>

    <script>
        const SHEETS = {
            questions: '1WyxijjF5hdX6B8bmCQOk-16Jwon1ejECbBuQXH0iwaI',
            students: '1cBr5-rX-HAI-ZykHwE1cSSTyquNno82h0fyf4vUAdyI'
        };

        let db = [], currentQuestions = [], qIdx = 0;
        let teamA = [], teamB = [], scores = {a:0, b:0}, turn = 'a';
        let timer, timeLeft = 30;

        window.onload = () => {
            // تحميل الفصول والأسئلة
            const classSelect = document.getElementById('class-select');
            classSelect.innerHTML = '<option value="">-- اختر الفصل --</option>';
            for(let i=1; i<=8; i++) classSelect.innerHTML += `<option value="${i}">سادس (${i})</option>`;

            Papa.parse(`https://docs.google.com/spreadsheets/d/${SHEETS.questions}/gviz/tq?tqx=out:csv`, {
                download: true, complete: (res) => {
                    db = res.data.filter(r => r[0] && r[0] !== "الوحدة");
                    const units = [...new Set(db.map(r => r[0]))];
                    units.forEach(u => document.getElementById('unit-select').innerHTML += `<option value="${u}">${u}</option>`);
                }
            });
        };

        function loadLessons() {
            const unit = document.getElementById('unit-select').value;
            const lessons = [...new Set(db.filter(r => r[0] === unit).map(r => r[1]))];
            const sel = document.getElementById('lesson-select');
            sel.innerHTML = '<option value="all">جميع الدروس</option>';
            lessons.forEach(l => sel.innerHTML += `<option value="${l}">${l}</option>`);
            sel.disabled = false;
        }

        function fetchData() {
            const cls = document.getElementById('class-select').value;
            Papa.parse(`https://docs.google.com/spreadsheets/d/${SHEETS.students}/gviz/tq?tqx=out:csv&sheet=${cls}`, {
                download: true, complete: (res) => {
                    const all = res.data.map(r => r[0]).filter(n => n && n !== "الاسم");
                    let shuf = all.sort(() => 0.5 - Math.random());
                    teamA = [shuf[0], shuf[1]]; teamB = [shuf[2], shuf[3]];
                    document.getElementById('list-a-preview').innerText = teamA.join(' - ');
                    document.getElementById('list-b-preview').innerText = teamB.join(' - ');
                    document.getElementById('teams-preview').classList.remove('hidden');
                    document.getElementById('start-btn').disabled = false;
                }
            });
        }

        function startGame() {
            const unit = document.getElementById('unit-select').value;
            const lesson = document.getElementById('lesson-select').value;
            currentQuestions = db.filter(r => r[0] === unit && (lesson === 'all' || r[1] === lesson)).sort(() => 0.5 - Math.random());
            
            document.getElementById('lobby-panel').classList.add('hidden');
            document.getElementById('game-screen').style.display = 'grid';
            document.getElementById('lesson-title').innerText = `مسار البيانات | ${unit}`;
            
            // تعبئة أسماء الطلاب في الواجهة
            document.getElementById('students-a').innerHTML = teamA.map(s => `<li>${s}</li>`).join('');
            document.getElementById('students-b').innerHTML = teamB.map(s => `<li>${s}</li>`).join('');
            
            showQuestion();
        }

        function showQuestion() {
            if(qIdx >= currentQuestions.length) return alert("انتهت الأسئلة!");
            
            updateTurnUI();
            const q = currentQuestions[qIdx];
            
            // معالجة السؤال
            const qBody = q[2];
            if(qBody.includes('drive.google.com')) {
                const id = qBody.match(/\/d\/([a-zA-Z0-9_-]+)/)[1];
                document.getElementById('q-text').innerText = "ما هي نتيجة اللبنة البرمجية؟";
                document.getElementById('q-image').innerHTML = `<img src="https://drive.google.com/uc?export=view&id=${id}" style="max-height:150px; margin-bottom:10px;">`;
            } else {
                document.getElementById('q-text').innerText = qBody;
                document.getElementById('q-image').innerHTML = "";
            }

            // الخيارات
            const opts = document.getElementById('options');
            opts.innerHTML = "";
            [3,4,5,6].forEach((idx, i) => {
                if(q[idx]) {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerText = q[idx];
                    btn.onclick = () => check(i+1, q[6]); // العمود G هو الإجابة الصحيحة
                    opts.appendChild(btn);
                }
            });

            resetTimer();
        }

        function updateTurnUI() {
            const sideA = document.getElementById('side-a');
            const sideB = document.getElementById('side-b');
            const statusA = document.getElementById('status-a');
            const statusB = document.getElementById('status-b');

            if(turn === 'a') {
                sideA.classList.remove('inactive'); sideB.classList.add('inactive');
                statusA.innerText = "دوركم الآن! 🚀"; statusA.className = "status-badge active-turn";
                statusB.innerText = "في انتظار دورك..."; statusB.className = "status-badge waiting";
            } else {
                sideB.classList.remove('inactive'); sideA.classList.add('inactive');
                statusB.innerText = "دوركم الآن! 🚀"; statusB.className = "status-badge active-turn";
                statusA.innerText = "في انتظار دورك..."; statusA.className = "status-badge waiting";
            }
        }

        function check(choice, correct) {
            clearInterval(timer);
            if(choice == correct) {
                scores[turn]++;
                document.getElementById(`score-${turn}`).innerText = scores[turn];
            }
            
            turn = turn === 'a' ? 'b' : 'a';
            qIdx++;
            setTimeout(showQuestion, 1000);
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 30;
            const el = document.getElementById('timer');
            el.innerText = timeLeft;
            el.style.color = "var(--accent-yellow)";
            
            timer = setInterval(() => {
                timeLeft--;
                el.innerText = timeLeft;
                if(timeLeft <= 5) {
                    el.style.color = "#ff4444";
                    document.getElementById('tick-sound').play();
                }
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    turn = turn === 'a' ? 'b' : 'a';
                    qIdx++;
                    showQuestion();
                }
            }, 1000);
        }
    </script>
</body>
</html>
