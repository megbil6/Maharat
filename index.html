<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنافس وتعلم</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #12182b;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-yellow: #ffd700;
            --btn-orange: linear-gradient(90deg, #ffaa00, #ff7700);
            --input-bg: #1e293b;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1e293b, #12182b);
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            padding: 20px;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 550px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .section-title {
            color: var(--accent-yellow);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: var(--input-bg);
            color: white;
            font-size: .95rem;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .row-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
        }

        .row-group input {
            width: 80px;
            text-align: center;
        }

        .start-btn {
            background: var(--btn-orange);
            color: #111;
            font-weight: 900;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 119, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 119, 0, 0.4);
        }

        .start-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* تنسيقات الفرق (مخفية البداية) */
        .teams-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }
        .team-box {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 10px;
            border-top: 4px solid;
        }
        .team-a { border-color: #10b981; }
        .team-b { border-color: #3b82f6; }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 5px 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .swap-btn {
            background: #475569;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .hidden { display: none !important; }
        #loading-msg { color: #10b981; text-align: center; margin-top: 10px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="main-title">
        تنافس وتعلم 🏆
    </div>

    <div class="glass-panel" id="lobby-panel">
        <div class="section-title">📚 اختر الدرس والفصل</div>
        
        <div class="form-group">
            <select id="unit-select" onchange="loadLessons()">
                <option value="">-- اختر الوحدة --</option>
            </select>
        </div>

        <div class="form-group">
            <select id="lesson-select" disabled>
                <option value="">-- اختر الدرس --</option>
            </select>
        </div>

        <div class="form-group">
            <select id="class-select" onchange="fetchStudentsAndGenerateTeams()">
                <option value="">-- اختر الفصل --</option>
                <option value="1">سادس (1)</option>
                <option value="2">سادس (2)</option>
                <option value="3">سادس (3)</option>
                <option value="4">سادس (4)</option>
                <option value="5">سادس (5)</option>
                <option value="6">سادس (6)</option>
                <option value="7">سادس (7)</option>
                <option value="8">سادس (8)</option>
            </select>
        </div>

        <div class="row-group">
            <label>عدد الأسئلة:</label>
            <input type="number" id="question-count" value="10" min="1" max="50">
        </div>

        <div id="loading-msg"></div>

        <div class="teams-container hidden" id="teams-area">
            <div class="team-box team-a">
                <h3 style="color: #10b981; margin-top: 0;">الفريق الأول</h3>
                <div id="team-a-list"></div>
            </div>
            <div class="team-box team-b">
                <h3 style="color: #3b82f6; margin-top: 0;">الفريق الثاني</h3>
                <div id="team-b-list"></div>
            </div>
        </div>
    </div>

    <button id="start-btn" class="start-btn" onclick="startCompetition()" disabled>
        ابدأ المسابقة 🚀
    </button>

    <script>
        const QUESTIONS_SHEET_ID = '1WyxijjF5hdX6B8bmCQOk-16Jwon1ejECbBuQXH0iwaI';
        const STUDENTS_SHEET_ID = '1cBr5-rX-HAI-ZykHwE1cSSTyquNno82h0fyf4vUAdyI';

        let allQuestions = [];
        let availableStudents = [];
        let teamA = [];
        let teamB = [];

        // عند تحميل الصفحة، جلب الوحدات والدروس
        window.onload = function() {
            document.getElementById('loading-msg').innerText = "جاري الاتصال بقاعدة البيانات...";
            const url = `https://docs.google.com/spreadsheets/d/${QUESTIONS_SHEET_ID}/gviz/tq?tqx=out:csv`;
            
            Papa.parse(url, {
                download: true,
                header: false,
                complete: function(results) {
                    allQuestions = results.data.filter(row => row.length > 3 && row[0]);
                    populateUnits();
                    document.getElementById('loading-msg').innerText = "";
                },
                error: function(error) {
                    document.getElementById('loading-msg').innerText = "❌ خطأ في قراءة الأسئلة. تأكد من نشر الملف.";
                    console.error("Error:", error);
                }
            });
        };

        function populateUnits() {
            const unitSelect = document.getElementById('unit-select');
            const units = [...new Set(allQuestions.map(row => row[0]))];
            units.forEach(unit => {
                if(unit && unit !== "الوحدة") {
                    unitSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
                }
            });
        }

        function loadLessons() {
            const unitSelect = document.getElementById('unit-select').value;
            const lessonSelect = document.getElementById('lesson-select');
            
            if(!unitSelect) {
                lessonSelect.innerHTML = '<option value="">-- اختر الدرس --</option>';
                lessonSelect.disabled = true;
                return;
            }

            const lessons = [...new Set(allQuestions.filter(row => row[0] === unitSelect).map(row => row[1]))];
            lessonSelect.innerHTML = '<option value="all">جميع دروس الوحدة</option>';
            lessons.forEach(lesson => {
                if(lesson) lessonSelect.innerHTML += `<option value="${lesson}">${lesson}</option>`;
            });
            lessonSelect.disabled = false;
        }

        // سحب الطلاب عند اختيار الفصل مباشرة
        function fetchStudentsAndGenerateTeams() {
            const className = document.getElementById('class-select').value;
            const loadingMsg = document.getElementById('loading-msg');
            const startBtn = document.getElementById('start-btn');
            
            if(!className) {
                document.getElementById('teams-area').classList.add('hidden');
                startBtn.disabled = true;
                return;
            }

            loadingMsg.innerText = `جاري سحب أسماء طلاب ${className}...`;
            startBtn.disabled = true;

            const url = `https://docs.google.com/spreadsheets/d/${STUDENTS_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${className}`;
            
            Papa.parse(url, {
                download: true,
                header: false,
                complete: function(results) {
                    availableStudents = results.data.map(row => row[0]).filter(name => name && name !== "الاسم" && name !== "اسم الطالب");
                    
                    if(availableStudents.length < 4) {
                        loadingMsg.innerText = `❌ خطأ: لم يتم العثور على طلاب كافين. تأكد من اسم التبويب في الشيت.`;
                        return;
                    }
                    
                    loadingMsg.innerText = "";
                    pickRandomTeams();
                    startBtn.disabled = false;
                },
                error: function() {
                    loadingMsg.innerText = "❌ فشل الاتصال بملف الطلاب.";
                }
            });
        }

        function pickRandomTeams() {
            let shuffled = [...availableStudents].sort(() => 0.5 - Math.random());
            teamA = [shuffled[0], shuffled[1]];
            teamB = [shuffled[2], shuffled[3]];
            availableStudents = availableStudents.filter(name => !teamA.includes(name) && !teamB.includes(name));
            renderTeams();
            document.getElementById('teams-area').classList.remove('hidden');
        }

        function swapStudent(teamName, index) {
            if(availableStudents.length === 0) {
                alert("تم استخدام جميع أسماء الفصل!");
                return;
            }
            let randomIndex = Math.floor(Math.random() * availableStudents.length);
            let newStudent = availableStudents[randomIndex];

            if(teamName === 'A') {
                availableStudents.push(teamA[index]);
                teamA[index] = newStudent;
            } else {
                availableStudents.push(teamB[index]);
                teamB[index] = newStudent;
            }
            availableStudents.splice(randomIndex, 1);
            renderTeams();
        }

        function renderTeams() {
            const listA = document.getElementById('team-a-list');
            const listB = document.getElementById('team-b-list');
            
            listA.innerHTML = teamA.map((s, i) => `
                <div class="student-item">
                    <span>${s}</span>
                    <button class="swap-btn" onclick="swapStudent('A', ${i})">تبديل</button>
                </div>`).join('');
                
            listB.innerHTML = teamB.map((s, i) => `
                <div class="student-item">
                    <span>${s}</span>
                    <button class="swap-btn" onclick="swapStudent('B', ${i})">تبديل</button>
                </div>`).join('');
        }

        function startCompetition() {
            let selectedLesson = document.getElementById('lesson-select').value;
            let count = document.getElementById('question-count').value;
            
            if(!selectedLesson) {
                alert("الرجاء اختيار الدرس أولاً!");
                return;
            }
            
            // هنا ننتقل لبرمجة شاشة اللعبة لاحقاً
            alert(`تم البدء! \nالفريق الأول: ${teamA.join(' و ')} \nالفريق الثاني: ${teamB.join(' و ')} \nعدد الأسئلة: ${count}`);
        }
    </script>
</body>
</html>
